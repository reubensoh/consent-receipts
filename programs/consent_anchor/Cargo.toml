[package]
name = "consent_anchor"
version = "0.1.0"
description = "Anchors a consent receipt hash on Solana devnet: one PDA per receipt hash"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "consent_anchor"

[features]
default = []
svm-tests = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"

# SVM integration tests need target/deploy/consent_anchor.so from `anchor build`;
# they are feature-gated so plain `cargo test` (CI) runs only the unit tests.
[dev-dependencies]
litesvm = "0.16.0"
solana-keypair = "^3.1.2"
solana-signer = "^3.0.1"
solana-message = "^4.2.4"
solana-transaction = "^4.1.5"
